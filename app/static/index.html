<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share your photos</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 30px auto; padding: 0 16px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input[type=text], input[type=password], input[type=file] { width: 100%; padding: 8px; box-sizing: border-box; }
    .consent { font-weight: normal; display: flex; gap: 8px; align-items: flex-start; }
    button { margin-top: 18px; padding: 10px 18px; font-size: 16px; }
    #msg { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; }
    .ok { background: #d4f5dd; }
    .err { background: #fbd5d5; }
  </style>
</head>
<body>
  <h1>🪔 Share your photos</h1>

  <form id="form">
    <label>Your name
      <input type="text" name="name" maxlength="50" required>
    </label>

    <label>4-digit PIN (remember it, you need it when you come back)
      <input type="password" name="pin" inputmode="numeric" pattern="\d{4}" maxlength="4" required>
    </label>

    <label>Photos (JPG, PNG, WebP, max 5 MB each, up to 5)
      <input type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple required>
    </label>

    <label class="consent">
      <input type="checkbox" name="consent" value="true" required>
      I agree that my photos will be shown on a public screen.
    </label>

    <button type="submit">Upload</button>
  </form>

  <div id="msg"></div>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");

    function show(text, ok) {
      msg.textContent = text;
      msg.className = ok ? "ok" : "err";
      msg.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const res = await fetch("/upload", { method: "POST", body: new FormData(form) });
        const data = await res.json();
        if (res.ok) {
          show(data.returning_visitor
            ? "Welcome back! " + data.photos_saved + " photo(s) uploaded."
            : "Thanks! " + data.photos_saved + " photo(s) uploaded.", true);
          form.reset();
        } else {
          show(typeof data.detail === "string" ? data.detail : "Please check your inputs.", false);
        }
      } catch (err) {
        show("Network error. Please try again.", false);
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
