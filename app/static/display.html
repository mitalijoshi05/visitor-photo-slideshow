<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Slideshow</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
                 font-family: sans-serif; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100%; }
    #photo { width: 100%; height: 100%; object-fit: contain;
             transition: opacity 0.6s; opacity: 0; }
    #caption { position: absolute; left: 24px; bottom: 24px; font-size: 28px;
               background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px;
               display: none; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; font-size: 32px; text-align: center; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="photo" alt="">
    <div id="caption"></div>
    <div id="empty">🪔 Waiting for photos...<br>Scan the QR code to upload yours!</div>
  </div>

 
<script>
  const SLIDE_SECONDS = 5;
  const REFRESH_SECONDS = 30;

  const photo = document.getElementById("photo");
  const caption = document.getElementById("caption");
  const empty = document.getElementById("empty");

  let photos = [];
  let index = 0;
  let priorityQueue = [];
  let knownIds = new Set();
  let slideTimer = null;

  async function loadPhotos(queueNew = false) {
    try {
      const response = await fetch("/api/photos");

      if (!response.ok) {
        throw new Error("Could not load photos");
      }

      const latestPhotos = await response.json();

      const newPhotos = latestPhotos.filter(
        item => !knownIds.has(item.id)
      );

      latestPhotos.forEach(item => knownIds.add(item.id));

      if (queueNew) {
        priorityQueue.push(...newPhotos);
      }

      photos = latestPhotos;

      return newPhotos.length;

    } catch (error) {
      console.error("Photo loading error:", error);
      return 0;
    }
  }

  function showNext() {
    if (photos.length === 0) {
      empty.style.display = "flex";
      photo.style.opacity = 0;
      photo.removeAttribute("src");
      caption.style.display = "none";
      return;
    }

    empty.style.display = "none";

    let current;

    if (priorityQueue.length > 0) {
      current = priorityQueue.shift();
    } else {
      if (index >= photos.length) {
        index = 0;
      }

      current = photos[index];
      index = (index + 1) % photos.length;
    }

    photo.style.opacity = 0;

    setTimeout(() => {
      photo.onload = () => {
        photo.style.opacity = 1;
      };

      photo.src = current.url;

      caption.textContent = "📸 " + current.name;
      caption.style.display = "block";

    }, 600);
  }

  function resetSlideTimer() {
    clearInterval(slideTimer);

    slideTimer = setInterval(
      showNext,
      SLIDE_SECONDS * 1000
    );
  }

  async function handleNewPhotos() {
    const added = await loadPhotos(true);

    if (added > 0) {
      showNext();
      resetSlideTimer();
    }
  }

  async function handleDeletedPhotos() {
    await loadPhotos(false);

    priorityQueue = priorityQueue.filter(
      item => knownIds.has(item.id)
    );

    index = 0;
    showNext();
    resetSlideTimer();
  }

  // Connect the TV display to the backend SSE endpoint
  const source = new EventSource("/events");

  source.onmessage = async (e) => {
    try {
      const event = JSON.parse(e.data);

      if (event.type === "photos_deleted") {
        await handleDeletedPhotos();

      } else if (event.type === "new_photos") {
        await handleNewPhotos();
      }

    } catch (error) {
      console.error("Live event error:", error);
    }
  };

  source.onerror = () => {
    console.warn("Live connection interrupted. Reconnecting...");
  };

  // Load existing photos when the display opens
  async function initializeSlideshow() {
    await loadPhotos(false);

    showNext();
    resetSlideTimer();
  }

  initializeSlideshow();

  // Backup polling in case a live event is missed
  setInterval(async () => {
    const added = await loadPhotos(true);

    if (added > 0) {
      showNext();
      resetSlideTimer();
    }
  }, REFRESH_SECONDS * 1000);

</script>

</body>
</html>
